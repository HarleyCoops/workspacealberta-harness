# Apply after workspace-alberta.patch.yml from the repository root.
# Set WA_APC_PYTHON to the connector virtualenv's absolute Python executable.
- insert:
    - id: mcp-apc-local
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        transport: stdio
        serverName: apc_local
        command: !!js process.env.WA_APC_PYTHON || 'python'
        args: ['integrations/apc/server.py']
        cwd: !!js process.cwd()
        toolCallTimeoutMs: 240000
        failOnStartupError: true
